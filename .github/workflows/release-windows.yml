name: Build and publish Windows app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Assign unique release version
        shell: bash
        run: npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version

      - name: Create and push version tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "KIDS Gaming Hub $VERSION"
          git push origin "v$VERSION"

      - name: Build desktop renderer
        run: npm run electron:build

      - name: Package and publish Windows installer
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
